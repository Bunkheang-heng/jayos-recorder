<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>JAYOS Recorder</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="toolbar" class="toolbar">
      <button id="source-btn" class="pill-btn" title="Choose what to record">
        <span id="source-label">Full Screen</span>
      </button>

      <button id="mic-btn" class="icon-btn active" title="Toggle microphone">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button id="cam-btn" class="icon-btn active" title="Toggle webcam">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>

      <div id="timer" class="timer hidden">00:00</div>

      <button id="record-btn" class="record-btn" title="Start recording">
        <span class="dot"></span>
      </button>
      <button id="pause-btn" class="icon-btn hidden" title="Pause">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button id="stop-btn" class="icon-btn hidden" title="Stop">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>

      <div id="countdown" class="countdown hidden"></div>
    </div>

    <div id="source-menu" class="menu hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
